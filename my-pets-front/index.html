<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Tipografía de la marca (logo "PetHealth"): Space Grotesk, solo los pesos que usa el logo -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>PetHealth | Historia clínica y QR para tus mascotas</title>
    <meta name="description" content="Gestiona la historia clínica, vacunas, peso y recordatorios de tus mascotas en un solo lugar. Para perros, gatos, aves, conejos y todas tus mascotas." />
    <meta name="keywords" content="mascotas, veterinaria, salud animal, carnet de vacunación, gatos, perros, aves, conejos, historia clínica digital, recordatorios veterinarios, app mascotas" />
    <meta name="author" content="PetHealth Team" />
    
    <meta name="theme-color" content="#10b981" /> 

    <!-- DOMINIO: si cambia la URL del sitio, reemplazar https://oet-health-front.vercel.app acá y en public/robots.txt y public/sitemap.xml -->
    <link rel="canonical" href="https://oet-health-front.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oet-health-front.vercel.app/" />
    <meta property="og:title" content="PetHealth | Gestión Inteligente de Mascotas" />
    <meta property="og:description" content="Lleva el control total de la salud de tus peludos. Historia clínica, vacunas y más en tu bolsillo." />
    <meta property="og:image" content="https://oet-health-front.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gato con una chapita QR de PetHealth en el collar" />
    <meta property="og:locale" content="es_AR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PetHealth | Gestión Inteligente de Mascotas" />
    <meta name="twitter:description" content="Lleva el control total de la salud de tus peludos. Historia clínica, vacunas y más en tu bolsillo." />
    <meta name="twitter:image" content="https://oet-health-front.vercel.app/og-image.jpg" />
  </head>
  <body>
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        
        // console.log('[INIT] PetHealth Theme:', theme, '| isDark:', isDark); // Descomentar para debug
        
        const root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('dark');
          root.style.colorScheme = 'light';
        }
      })();
    </script>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
